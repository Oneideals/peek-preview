    <circle cx="380" cy="70" r="2.2"/><circle cx="520" cy="180" r="1.6"/>
    <circle cx="700" cy="110" r="2"/><circle cx="1040" cy="80" r="1.9"/>
    <circle cx="1140" cy="190" r="2.3"/><circle cx="180" cy="270" r="1.5"/>
    <circle cx="640" cy="40" r="1.7"/><circle cx="960" cy="140" r="1.4"/>
  </g>

  <path d="M0 560 L200 420 L340 520 L520 360 L700 500 L860 420 L1020 540 L1200 470 L1200 800 L0 800 Z" fill="url(#ridge)"/>
  <path d="M0 660 L160 580 L320 650 L520 540 L740 640 L920 570 L1200 660 L1200 800 L0 800 Z" fill="#0d0620"/>

  <g stroke="#ffd9a0" stroke-width="3" opacity="0.55" fill="none">
