    <path d="M60 750 Q320 734 580 756 T1140 748"/>
  </g>

  <text x="72" y="676" font-family="-apple-system, Helvetica, sans-serif" font-size="54" font-weight="600" fill="#ffffff">Peek 图片查看器</text>
  <text x="74" y="728" font-family="-apple-system, Helvetica, sans-serif" font-size="26" fill="#e8dfc9">滚轮缩放 · 双击放大 · 拖拽平移 · 一键适应</text>
