<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Peek 图片查看器示例图">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="0.55" stop-color="#5b4fd6"/>
      <stop offset="1" stop-color="#f0a86b"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b4d"/>
      <stop offset="1" stop-color="#140b26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9c9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe9c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="880" cy="250" r="230" fill="url(#glow)"/>
  <circle cx="880" cy="250" r="86" fill="#fff3d6"/>

  <g fill="#ffffff" opacity="0.85">
